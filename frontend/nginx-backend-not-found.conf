location /api {
    set $backend_host backend;
    proxy_pass http://$backend_host:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /docs {
    set $backend_host backend;
    proxy_pass http://$backend_host:8000;
    proxy_set_header Host $host;
}
location /redoc {
    set $backend_host backend;
    proxy_pass http://$backend_host:8000;
    proxy_set_header Host $host;
}
